<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lost in the hive — TRNT BEE</title>
  <meta name="theme-color" content="#070708" />
  <link rel="icon" href="/images/brand/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/main.css" />
  <style>
    .lost { min-height: 100svh; display: grid; place-items: center; text-align: center; padding: 40px var(--pad); }
    .lost .bee { font-size: 90px; color: var(--honey); animation: hover 3s ease-in-out infinite; }
    .lost h1 { font-size: clamp(90px, 24vw, 260px); line-height: .85; letter-spacing: -.06em; font-weight: 700; margin: 20px 0 10px; }
    .lost p { color: var(--ink-2); font-size: 18px; margin-bottom: 34px; }
  </style>
</head>
<body>
  <div class="grain"></div>
  <main class="lost">
    <div>
      <i class="bee"></i>
      <h1>4<em>0</em>4</h1>
      <p>This cell of the hive is empty.</p>
      <a class="btn btn-solid" href="/">Back to the hive →</a>
    </div>
  </main>
</body>
</html>
